# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$shlvl\
$directory\
$git_branch\
$git_commit\
${custom.git_tags}\
$git_state\
$git_metrics\
$git_status\
$hg_branch\
$docker_context\
$package\
$c\
$elixir\
$erlang\
$golang\
$lua\
$nodejs\
$ocaml\
$php\
$python\
$rust\
$zig\
$nix_shell\
$direnv\
$cmd_duration\
$fill\
$time\
$line_break\
$jobs\
$battery\
$os\
$container\
$shell\
$character"""

add_newline = true

[character]
error_symbol = '[✗](bold red)'

[directory]
truncate_to_repo = false
truncation_length = 100
style = "bold bright-cyan"
repo_root_style = 'bold green'
before_repo_root_style = 'white'

[directory.substitutions]
'~/repositories/exg/app/ers' = 'ers'

[direnv]
# disabled = false

[git_branch]
symbol = ''
style = 'purple'
only_attached = true
# ignore_branches = ['master', 'main', 'development']

[git_commit]
style = 'purple'

[custom.git_tags]
description = "Output the current git tags"
command = "git tag --points-at | paste -s -d ' '"
symbol = ' '
format = '[($symbol\($output\) )]($style)'
style = 'purple'
# Only when inside git repository
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1"

[git_status]
stashed = ''
modified = '*'

[python]
symbol = " "

[nix_shell]
symbol = "󱄅 "

[shlvl]
disabled = false
threshold = 2
symbol = "↕"

[os]
disabled = true
symbols.Ubuntu = " "
symbols.NixOS = " "

[shell]
disabled = false
bash_indicator = ""

[fill]
symbol = " "

[time]
disabled = false
format = '[$time]($style)'
style = 'yellow'
