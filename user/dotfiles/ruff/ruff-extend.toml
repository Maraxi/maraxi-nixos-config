# The default config file discovery of ruff usually finds ~/.config/ruff/ruff.toml
# which also includes this file.
# If a project has its own own pyproject.toml with ruff settings then
# the ruff LSP in nvim still merges in the options from this file.

preview = true

[format]
docstring-code-format = true

[lint]
extend-select = [
  "line-too-long",
]
