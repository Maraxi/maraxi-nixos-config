set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:clipboard:hyperlinks:usstyle"

# Change prefix to Ctrl+a (more ergonomic)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Better pane splitting (and keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Plugins (nix-managed, see user/tmux.nix)
run-shell ~/.local/share/tmux/plugins/sensible/sensible.tmux

# resurrect keeps its data under XDG state; continuum autosaves and restores via resurrect
set -g @resurrect-dir "~/.local/state/tmux/resurrect"
set -g @resurrect-capture-pane-contents "on"
set -g @resurrect-strategy-nvim "session"
set -g @continuum-restore "on"
run-shell ~/.local/share/tmux/plugins/resurrect/resurrect.tmux
run-shell ~/.local/share/tmux/plugins/continuum/continuum.tmux
