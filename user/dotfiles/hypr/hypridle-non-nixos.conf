# hypridle reads this file only at start: after editing run `systemctl --user restart hypridle`
general {
    # swaylock + fingerprint, see user/hyprland-ubuntu.nix
    lock_cmd = lock-screen
    # lock before suspend (lid close, `systemctl suspend`, ...)
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    # hold back the suspend until the wayland session is really locked (default 2 only waits for hyprlock),
    # otherwise the unlocked desktop is visible for a moment after resume
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
